[lock]
platforms = ["darwin-arm64", "linux-amd64-glibc", "windows-amd64"]

[runtimes]
go = { ref = "./.oku/go.toml", version = "1.27" }

[packages]
go = { ref = "./.oku/go.toml", version = "1.27" }
golangci-lint = { ref = "github:golangci/golangci-lint", version = "^2" }
gofumpt = "github:mvdan/gofumpt"
golines = "github:golangci/golines"
gopls = "go:golang.org/x/tools/gopls"
goimports = "go:golang.org/x/tools/cmd/goimports"
golangci-lint-langserver = "github:nametake/golangci-lint-langserver"
